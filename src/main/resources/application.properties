spring.application.name=calculator
server.port=${SERVER_PORT:8080}

# Actuator: expose only what we need (health for Docker/Compose probes, info for metadata)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=calculator
info.app.version=@project.version@
info.app.instance=${INSTANCE_NAME:local}

# Missing/invalid parameters are handled by GlobalExceptionHandler; never leak stack traces
server.error.include-stacktrace=never
