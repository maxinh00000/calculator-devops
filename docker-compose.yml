# Full stack: two replicas of the Calculator API behind an Nginx reverse proxy.
#   docker compose up -d          -> launches everything
#   curl http://localhost:8085/api/v1/add?a=2&b=3
#
# Variables (with defaults) can be overridden from the shell or a .env file:
#   DOCKERHUB_USER, IMAGE_TAG, PROXY_PORT

x-calculator: &calculator
  image: ${DOCKERHUB_USER:-maxinh0}/calculator:${IMAGE_TAG:-latest}
  restart: unless-stopped
  environment: &calc-env
    SPRING_APPLICATION_NAME: calculator
    SERVER_PORT: "8080"
    JAVA_OPTS: "-Xms64m -Xmx256m"
  expose:
    - "8080"
  networks:
    - calc-net
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
    interval: 15s
    timeout: 3s
    retries: 5
    start_period: 40s

services:
  calculator-1:
    <<: *calculator
    environment:
      <<: *calc-env
      INSTANCE_NAME: calculator-1

  calculator-2:
    <<: *calculator
    environment:
      <<: *calc-env
      INSTANCE_NAME: calculator-2

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8085}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - calc-net
    depends_on:
      calculator-1:
        condition: service_healthy
      calculator-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

networks:
  calc-net:
    driver: bridge
