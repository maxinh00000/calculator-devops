# Reverse proxy + round-robin load balancer in front of the two API replicas.

# Docker's embedded DNS. Re-resolve container names every 10s so that when
# Jenkins recreates a replica (new IP) Nginx picks it up without a restart.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream calculator_backend {
    zone calculator_backend 64k;
    server calculator-1:8080 resolve max_fails=3 fail_timeout=10s;
    server calculator-2:8080 resolve max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    # Shows which replica answered (useful in the demo to prove load balancing)
    add_header X-Upstream-Server $upstream_addr always;

    location /api/ {
        proxy_pass http://calculator_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location /actuator/ {
        proxy_pass http://calculator_backend;
    }

    # Nginx's own liveness endpoint (used by its Compose health check)
    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
    }
}
